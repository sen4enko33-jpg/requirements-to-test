# Task 3: the agent. The key is read from OPENROUTER_API_KEY (.env in the repository root or in this folder).
model:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-4o-mini            # the same model as task 2; supports tool calling
  temperature: 0
  max_tokens: 1024                     # per model call
  timeout_s: 60                        # per model call (shortened when the request has less time left)
  max_retries: 3                       # connection errors, 429 and 5xx of the model API, with exponential backoff
  price_per_1m: {input: 0.15, output: 0.60}   # USD, used only when the provider does not report the cost
  extra_body: {provider: {require_parameters: true}}   # route only to endpoints that support tool calling

# Limits of one request (one question). When one is reached the agent stops and returns what it has (a partial result);
# the reason is written to the trace (stop_reason).
limits:
  max_steps: 8                         # model calls per request
  max_tokens_total: 40000              # input + output tokens of all model calls of the request
  max_cost_usd: 0.02                   # cost of all model calls of the request
  request_timeout_s: 120               # wall time of the whole request
  tool_timeout_s: 20                   # one tool call

system_prompt: v1                      # prompts/system_<version>.md
trace_dir: traces                      # one JSONL file per request (not in git)
