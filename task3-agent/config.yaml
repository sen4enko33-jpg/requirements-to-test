# Task 3: the agent. The key is read from OPENROUTER_API_KEY (.env in the repository root or in this folder).
model:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-4o-mini            # the same model as task 2; supports tool calling
  temperature: 0
  max_tokens: 1024                     # per model call
  timeout_s: 60                        # per model call (shortened when the request has less time left)
  max_retries: 3                       # connection errors, 429 and 5xx of the model API, with exponential backoff
  price_per_1m: {input: 0.15, output: 0.60}   # USD, used only when the provider does not report the cost
  extra_body: {provider: {require_parameters: true}}   # route only to endpoints that support tool calling

# Limits of one request (one question). When one is reached the agent stops and returns what it has (a partial result);
# the reason is written to the trace (stop_reason).
limits:
  max_steps: 8                         # model calls per request
  max_tool_calls: 12                   # tool calls per request: one model call can ask for dozens of them (seen: 41)
  max_tokens_total: 40000              # input + output tokens of all model calls of the request
  max_cost_usd: 0.02                   # cost of all model calls of the request
  request_timeout_s: 120               # wall time of the whole request
  tool_timeout_s: 20                   # one tool call

# Retries of a failed tool call (timeout, 429, 503): only for safe (read-only) tools, a tool that changes data runs once.
tool_retry:
  max_attempts: 3                      # the first attempt included
  backoff_s: 0.5                       # pause before the 2nd attempt, doubled for every next one (429: Retry-After if longer)
  backoff_max_s: 4

# MCP servers the agent connects to (step 2). The agent starts each one as a subprocess (stdio) with its own Python, for the
# whole request; its tools (names, descriptions, schemas, read-only or not) come from the server, see tools/mcp_tools.py.
mcp:
  tracker:
    module: mcp_server.tracker_server  # python -m <module>
    env: {TRACKER_TEAM: hr-policy-qa, TRACKER_ROLE: reader}   # who the agent is for the server (mcp_server/access.yaml)
    start_timeout_s: 30                # the server did not start -> the agent runs without its tools and says so
    call_timeout_s: 15                 # one tools/call (the tool_timeout_s of the request can only shorten it)
    log: traces/mcp_tracker.log        # stderr of the server (its ALLOW / DENY lines), not mixed into the answer

system_prompt: v6                      # prompts/system_<version>.md
trace_dir: traces                      # one JSONL file per request (not in git)
