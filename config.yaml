timeout_s: 60
max_retries: 3
max_tokens: 8192

models:
  cloud:
    provider: anthropic
    model: claude-haiku-5-5
    price_in_per_1m: 0.10    # USD per 1M input tokens (prompts <= 100k tokens)
    price_out_per_1m: 0.50   # USD per 1M output tokens
  local:
    provider: ollama
    model: ""              # model name from your Ollama

sampling:
  A: {temperature: 0.0, top_p: 1.0}
  B: {temperature: 0.7, top_p: 0.9}
