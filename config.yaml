timeout_s: 60
max_retries: 3

models:
  cloud:
    provider: anthropic
    model: ""              # fill in the model you choose
    price_in_per_1m: null  # price per 1M input tokens, from the provider's price list
    price_out_per_1m: null
  local:
    provider: ollama
    model: ""              # model name from your Ollama

sampling:
  A: {temperature: 0.0, top_p: 1.0}
  B: {temperature: 0.7, top_p: 0.9}
