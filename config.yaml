prompts: [v1, v2]   # versions that `python main.py` runs; v3 was tried and rejected (prompts/CHANGELOG.md)
timeout_s: 60
max_retries: 3
max_tokens: 8192

models:
  cloud:
    provider: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: openai/gpt-4o-mini
    extra_body: {provider: {require_parameters: true}}   # route only to endpoints that support every request parameter
    price_in_per_1m: 0.15    # USD per 1M input tokens (OpenRouter page, check before the final table)
    price_out_per_1m: 0.60   # USD per 1M output tokens
  local:
    provider: ollama
    base_url: http://localhost:11434/v1
    api_key: ollama        # Ollama ignores the key, the SDK just needs a non-empty value
    model: llama3.2:3b
    timeout_s: 120         # local models are slower than the global default
    max_retries: 1         # at temperature 0 a retry repeats the same runaway generation
    max_tokens: 4096       # cuts a runaway generation early; tight for long documents (largest successful answer: 4040 tokens)
    # array limits (maxItems) added to the request schema only: the model loops inside lists (actors, then requirements)
    # and the strict JSON grammar will not let it close the array; 40 requirements fit the token budget (~60 tokens each)
    schema_limits: {actors: 10, open_questions: 10, requirements: 40}

sampling:
  A: {temperature: 0.0, top_p: 1.0}
  B: {temperature: 0.7, top_p: 0.9}
