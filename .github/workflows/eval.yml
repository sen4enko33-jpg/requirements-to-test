name: eval

# push / pull request: tests of both parts, then the retrieval evaluation and the answer scorers with failing thresholds
# (no API key needed). Manual run (Actions -> eval -> Run workflow): answers the test set with the model and runs the LLM judge;
# this needs the secret OPENROUTER_API_KEY.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            task1-extraction/requirements.txt
            task2-rag/requirements.txt
      - run: pip install -r task1-extraction/requirements.txt -r task2-rag/requirements.txt
      - name: Task 1 tests
        working-directory: task1-extraction
        run: |
          python tests/test_repair.py
          python tests/test_limits.py
          python tests/test_prompt_defs.py
      - name: Task 2 tests
        working-directory: task2-rag
        run: |
          for t in tests/test_*.py; do echo "== $t"; python "$t" || exit 1; done

  retrieval-eval:
    runs-on: ubuntu-latest
    needs: tests
    env:
      RAG_CHROMA_DIR: ${{ github.workspace }}/.chroma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: task2-rag/requirements.txt
      - run: pip install -r task2-rag/requirements.txt
      - name: Cache models and the index
        uses: actions/cache@v4
        with:
          path: |
            task2-rag/rag/.cache
            .chroma
          key: rag-index-${{ hashFiles('task2-rag/rag/data/chunks.jsonl', 'task2-rag/rag/models.py', 'task2-rag/requirements.txt') }}
      - name: Retrieval evaluation
        working-directory: task2-rag
        run: |
          python -m rag.chunking.cli --fixed
          python -m rag.retrieval.build
          python -m rag.retrieval.build --fixed
          python -m rag.eval.run_retrieval
      - name: Threshold - retrieval
        working-directory: task2-rag
        run: python -m rag.eval.check_thresholds retrieval
      - name: Threshold - answer scorers on the saved answers (prompt v3)
        working-directory: task2-rag
        run: python -m rag.eval.check_thresholds answers v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-results
          path: task2-rag/rag/data/retrieval_results.*

  answers-eval:
    # manual only: calls the answering model and the judge
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: tests
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RAG_CHROMA_DIR: ${{ github.workspace }}/.chroma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: task2-rag/requirements.txt
      - run: pip install -r task2-rag/requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            task2-rag/rag/.cache
            .chroma
          key: rag-index-${{ hashFiles('task2-rag/rag/data/chunks.jsonl', 'task2-rag/rag/models.py', 'task2-rag/requirements.txt') }}
      - name: Answer the test set and judge the answers
        working-directory: task2-rag
        run: |
          python -m rag.retrieval.build
          python -m rag.eval.run_answers --prompt v3
          python -m rag.eval.run_judge v3
      - name: Thresholds - scorers and judge
        working-directory: task2-rag
        run: |
          python -m rag.eval.check_thresholds answers v3
          python -m rag.eval.check_thresholds judge v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answers-v3
          path: task2-rag/rag/data/answers_v3.jsonl
